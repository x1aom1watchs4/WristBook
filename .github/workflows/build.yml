
name: Build WristBook APK and RPK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :phone:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WristBook-Android-APK
          path: phone/build/outputs/apk/debug/*.apk

  vela:
    name: Build Xiaomi Vela RPK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: watch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: watch/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install AIoT Toolkit
        run: npm install -g aiot-toolkit

      - name: Build Vela RPK
        run: aiot build

      - name: Check RPK
        run: |
          find dist -type f -name "*.rpk"
          test -n "$(find dist -type f -name '*.rpk' -print -quit)"

      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: WristBook-Xiaomi-Vela-RPK
          path: watch/dist/*.rpk
          if-no-files-found: error
