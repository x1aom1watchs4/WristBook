
name: Build WristBook APK and RPK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Сборка APK для Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android project
        run: |
          test -f settings.gradle.kts
          test -f phone/build.gradle.kts

      - name: Build APK
        run: gradle :phone:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WristBook-Android-APK
          path: phone/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  vela:
    name: Сборка Xiaomi Vela RPK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install AIoT Toolkit
        run: npm install -g aiot-toolkit

      - name: Install watch dependencies
        working-directory: watch
        run: npm install

      - name: Build Xiaomi Vela
        working-directory: watch
        run: aiot build

      - name: Check RPK
        working-directory: watch
        run: |
          find dist -type f -name "*.rpk"
          test -n "$(find dist -type f -name '*.rpk' -print -quit)"

      - name: Upload Xiaomi Watch RPK
        uses: actions/upload-artifact@v4
        with:
          name: WristBook-Xiaomi-Vela-RPK
          path: watch/dist/*.rpk
          if-no-files-found: error
