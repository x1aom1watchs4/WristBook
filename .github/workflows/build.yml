
name: Build WristBook APK and RPK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Сборка APK для Android
    runs-on: ubuntu-latest

    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v5

      - name: Установить JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Проверить файлы проекта
        run: |
          ls -la
          test -f ./gradlew

      - name: Собрать APK
        run: |
          chmod +x ./gradlew
          ./gradlew :phone:assembleDebug --stacktrace

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: WristBook-Android-APK
          path: phone/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  vela:
    name: Сборка Xiaomi Vela RPK
    runs-on: ubuntu-latest

    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v5

      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Проверить проект часов
        working-directory: watch
        run: |
          ls -la
          test -f package.json

      - name: Установить зависимости
        working-directory: watch
        run: npm ci

      - name: Собрать Xiaomi Vela
        working-directory: watch
        run: |
          npx aiot build

      - name: Проверить RPK
        working-directory: watch
        run: |
          find dist -type f -name "*.rpk"
          test -n "$(find dist -type f -name '*.rpk' -print -quit)"

      - name: Загрузить RPK
        uses: actions/upload-artifact@v4
        with:
          name: WristBook-Xiaomi-Vela-RPK
          path: watch/dist/*.rpk
          if-no-files-found: error
