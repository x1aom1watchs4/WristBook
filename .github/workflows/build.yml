name: Build WristBook APK and RPK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Сборка APK для Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Check Android project
        run: |
          test -f settings.gradle.kts
          test -f phone/build.gradle.kts
      - name: Download Notify-compatible XMS Wearable library
        run: |
          set -euo pipefail
          mkdir -p phone/libs
          curl --fail --location --retry 3 \
            https://www.mibandnotify.com/xiaomi-mi-band/xms/xms-wearable-lib_1.4_release.aar \
            --output phone/libs/xms-wearable-lib_1.4_release.aar
          test -s phone/libs/xms-wearable-lib_1.4_release.aar
          file phone/libs/xms-wearable-lib_1.4_release.aar
      - name: Prepare shared APK and RPK signing key
        id: shared-signing
        env:
          VELA_PRIVATE_KEY: ${{ secrets.VELA_PRIVATE_KEY }}
          VELA_CERTIFICATE: ${{ secrets.VELA_CERTIFICATE }}
        run: |
          set -euo pipefail
          if [ -z "$VELA_PRIVATE_KEY" ] || [ -z "$VELA_CERTIFICATE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Shared signing key is not configured."
            exit 0
          fi
          mkdir -p signing
          printf '%s\n' "$VELA_PRIVATE_KEY" > signing/private.pem
          printf '%s\n' "$VELA_CERTIFICATE" > signing/certificate.pem
          PASSWORD="$(openssl rand -hex 24)"
          openssl pkcs12 -export -inkey signing/private.pem -in signing/certificate.pem \
            -out signing/shared.p12 -name wristbook -passout "pass:$PASSWORD"
          echo "WRISTBOOK_KEYSTORE=$GITHUB_WORKSPACE/signing/shared.p12" >> "$GITHUB_ENV"
          echo "WRISTBOOK_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "WRISTBOOK_KEY_ALIAS=wristbook" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build signed APK with the watch app certificate
        if: steps.shared-signing.outputs.ready == 'true'
        run: gradle :phone:assembleRelease --stacktrace
      - name: Build debug APK fallback
        if: steps.shared-signing.outputs.ready != 'true'
        run: gradle :phone:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WristBook-Android-APK
          path: phone/build/outputs/apk/**/*.apk
          if-no-files-found: error

  vela:
    name: Сборка Xiaomi Vela RPK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Generate PNG app icon
        working-directory: watch
        run: |
          set -euo pipefail
          mkdir -p src/common
          echo '' | base64 --decode > src/common/wristbook-icon.png
          file src/common/wristbook-icon.png

      - name: Install Vela dependencies
        working-directory: watch
        run: npm install --no-audit --no-fund

      - name: Build Xiaomi Vela debug RPK
        working-directory: watch
        run: npm run build

      - name: Verify and stage debug RPK
        working-directory: watch
        run: |
          set -euo pipefail
          echo "Workspace: $GITHUB_WORKSPACE"
          find "$GITHUB_WORKSPACE/watch/dist" -type f -name '*.rpk' -print
          RPK="$(find "$GITHUB_WORKSPACE/watch/dist" -type f -name '*.debug.*.rpk' -print -quit)"
          test -n "$RPK"
          mkdir -p "$GITHUB_WORKSPACE/watch/artifacts"
          cp "$RPK" "$GITHUB_WORKSPACE/watch/artifacts/"

      - name: Upload Xiaomi Watch debug RPK
        uses: actions/upload-artifact@v4
        with:
          name: WristBook-Xiaomi-Vela-Debug-RPK
          path: watch/artifacts/*.debug.*.rpk
          if-no-files-found: error

      - name: Configure persistent Vela signing certificate
        id: signing
        working-directory: watch
        env:
          VELA_PRIVATE_KEY: ${{ secrets.VELA_PRIVATE_KEY }}
          VELA_CERTIFICATE: ${{ secrets.VELA_CERTIFICATE }}
        run: |
          set -euo pipefail
          if [ -z "$VELA_PRIVATE_KEY" ] || [ -z "$VELA_CERTIFICATE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; skipping release build."
            exit 0
          fi
          mkdir -p sign
          printf '%s\n' "$VELA_PRIVATE_KEY" > sign/private.pem
          printf '%s\n' "$VELA_CERTIFICATE" > sign/certificate.pem
          openssl pkey -in sign/private.pem -check -noout
          openssl x509 -in sign/certificate.pem -noout -subject -dates
          KEY_HASH="$(openssl pkey -in sign/private.pem -pubout -outform DER | sha256sum | cut -d' ' -f1)"
          CERT_HASH="$(openssl x509 -in sign/certificate.pem -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
          test "$KEY_HASH" = "$CERT_HASH"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build Xiaomi Vela release RPK
        if: steps.signing.outputs.ready == 'true'
        working-directory: watch
        run: npm run release

      - name: Verify and stage release RPK
        if: steps.signing.outputs.ready == 'true'
        working-directory: watch
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE/watch/dist" -type f -name '*.rpk' -print
          RPK="$(find "$GITHUB_WORKSPACE/watch/dist" -type f -name '*.release.*.rpk' -print -quit)"
          test -n "$RPK"
          mkdir -p "$GITHUB_WORKSPACE/watch/artifacts"
          cp "$RPK" "$GITHUB_WORKSPACE/watch/artifacts/"

      - name: Upload Xiaomi Watch release RPK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WristBook-Xiaomi-Vela-Release-RPK
          path: watch/artifacts/*.release.*.rpk
          if-no-files-found: error

      - name: Explain missing release signing secrets
        if: steps.signing.outputs.ready != 'true'
        run: |
          echo 'Release RPK was not built: configure repository Actions secrets VELA_PRIVATE_KEY and VELA_CERTIFICATE.'
          echo 'The debug RPK was built and uploaded separately.'
